<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c97a3d"/>
      <stop offset="1" stop-color="#a24f1e"/>
    </linearGradient>
    <linearGradient id="grain" x1="300" y1="200" x2="724" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6e8"/>
      <stop offset="1" stop-color="#eecf9d"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Wheat stalk: central stem + paired kernels, classic bakery mark -->
  <g stroke="url(#grain)" stroke-width="0" fill="url(#grain)">
    <!-- stem -->
    <rect x="497" y="230" width="30" height="560" rx="15" fill="url(#grain)"/>

    <!-- kernels, mirrored pairs down the stem, each a leaf/oval angled outward -->
    <g>
      <ellipse cx="0" cy="0" rx="34" ry="86" fill="url(#grain)" transform="translate(430,290) rotate(-38)"/>
      <ellipse cx="0" cy="0" rx="34" ry="86" fill="url(#grain)" transform="translate(594,290) rotate(38)"/>

      <ellipse cx="0" cy="0" rx="34" ry="86" fill="url(#grain)" transform="translate(418,410) rotate(-38)"/>
      <ellipse cx="0" cy="0" rx="34" ry="86" fill="url(#grain)" transform="translate(606,410) rotate(38)"/>

      <ellipse cx="0" cy="0" rx="34" ry="86" fill="url(#grain)" transform="translate(410,530) rotate(-38)"/>
      <ellipse cx="0" cy="0" rx="34" ry="86" fill="url(#grain)" transform="translate(614,530) rotate(38)"/>

      <ellipse cx="0" cy="0" rx="30" ry="76" fill="url(#grain)" transform="translate(414,644) rotate(-32)"/>
      <ellipse cx="0" cy="0" rx="30" ry="76" fill="url(#grain)" transform="translate(610,644) rotate(32)"/>
    </g>

    <!-- top tip -->
    <ellipse cx="512" cy="222" rx="26" ry="46" fill="url(#grain)"/>
  </g>
</svg>
