# Fly.io config for the public menu site (justcakeskosher.com). Static Vite
# SPA served by nginx, same pattern as web/ — build dist/ locally first with
# the correct VITE_API_URL, then `flyctl deploy --local-only`.
app = "just-cake-menu"
primary_region = "yyz"  # Toronto

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0  # static site cold-starts in ~1s; no need to idle-burn

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/"
