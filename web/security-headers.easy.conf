# Just Cake Easy: the dashboard's headers (security-headers.conf), except the
# microphone is allowed for this page itself — "tap 🎤 and talk" to the
# assistant needs it. Everything else is as locked down as the dashboard.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.fly.storage.tigris.dev; connect-src 'self' https://just-cake-bakery.fly.dev wss://just-cake-bakery.fly.dev; font-src 'self' data:" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
