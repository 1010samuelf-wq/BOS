# Just Cake Easy: the same prebuilt dist/ as the dashboard, but every route
# serves easy.html. The dashboard's index.html is in there too and simply never
# served at "/" — `index easy.html` and the fallback make sure of that.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index easy.html;

    location / {
        try_files $uri /easy.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Content-hashed bundles never change — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }
}
